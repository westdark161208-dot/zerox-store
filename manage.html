<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catálogo · Zero'X Store</title>
  <link rel="stylesheet" href="./manage.css">
  <script src="./manage.js" defer></script>
</head>
<body>
  <header><a href="./">← Tienda</a><h1>ZERO'X · CATÁLOGO</h1><button id="logout" type="button" hidden>Cerrar sesión</button></header>
  <main>
    <p id="message" role="status" aria-live="polite">Inicia sesión con tu cuenta de administrador.</p>
    <form id="login-form">
      <h2>Acceso al catálogo</h2>
      <label>Correo o usuario<input name="login" autocomplete="username" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Entrar</button>
    </form>
    <section id="workspace" hidden>
      <form id="product-form">
        <h2 id="form-title">Agregar producto</h2>
        <input name="id" type="hidden">
        <label>Sección<select name="section" required>
          <option value="accounts">Cuentas</option>
          <option value="clans">Venta de clanes</option>
          <option value="honor">Honor de clanes</option>
        </select></label>
        <label>Nombre<input name="name" maxlength="120" required></label>
        <label>Descripción<textarea name="description" maxlength="3000" rows="4"></textarea></label>
        <label>Precio MXN<input name="price" type="number" min="0" max="1000000" step="0.01" required></label>
        <label>Imagen (JPG, PNG o WebP; máximo 8 MB)<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <label>Video (MP4 o WebM; máximo 25 MB)<input name="video" type="file" accept="video/mp4,video/webm"></label>
        <p>Al editar, deja un archivo sin seleccionar para conservarlo.</p>
        <label class="check"><input name="active" type="checkbox"> Publicar en la tienda</label>
        <button type="submit">Guardar producto</button>
        <button id="reset-form" type="button">Nuevo producto</button>
      </form>
      <section><h2>Productos</h2><div id="product-list"></div></section>
    </section>
  </main>
</body>
</html>
