name: ZeroX RA staging - build only
on:
  push:
    branches:
      - codex/ra-founder-private-bridge-20261017
      - codex/ra-preprod-safety-audit-20261018
      - codex/ra-ff110-launch-pilot-20261018
    paths:
      - '.github/workflows/zerox-ra-staging-build.yml'
      - 'cloudflare/staging/**'
      - 'cloudflare/providers/ra-admin-service.mjs'
      - 'cloudflare/providers/founder-balances.mjs'
      - 'cloudflare/providers/ra-founder-read.mjs'
      - 'cloudflare/ra-purchase/**'
      - 'oracle/ra-purchase/**'
      - 'cloudflare/providers/**'
      - 'cloudflare/services/**'
      - 'cloudflare/diamonds/**'
      - 'tests/**'
      - 'cloudflare/preprod/**'
      - 'tests/ra-founder-phase2.test.mjs'
      - 'control.html'
      - 'control.css'
      - 'console.css'
      - 'panel-theme.css'
      - 'cloudflare/security/founder.mjs'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  staging-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify target and isolated D1 binding
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const m = JSON.parse(fs.readFileSync('cloudflare/staging/wrangler.jsonc','utf8'));
          assert.equal(m.name,'zerox-ra-founder-staging');
          assert.equal(m.workers_dev,false);
          assert.equal(m.preview_urls,false);
          assert.equal(m.main,'worker.mjs');
          assert.deepEqual(m.services,[{binding:'RA_READ_SERVICE',service:'zerox-ra-vpc-test'}]);
          assert.deepEqual(m.d1_databases,[{binding:'STAGING_AUTH_DB',database_name:'zerox-ra-founder-staging-auth',database_id:'a54b8020-71a4-4d4d-a576-800ee112a5cf'}]);
          for(const k of ['RA_DELIVERY_ENABLED','RA_CONTRACT_VERIFIED','DIAMOND_PRODUCTION_ENABLED'])assert.equal(m.vars[k],'false');
          assert.equal(m.vars.STAGING_READ_ONLY,'true');
          assert.equal(m.routes,undefined);
          assert.equal(m.route,undefined);
          assert.equal(m.triggers,undefined);
          console.log('STAGING_MANIFEST_OK');
          NODE
      - name: Verify original panel preview is current
        run: |
          node cloudflare/staging/build-control-preview.mjs
          git diff --exit-code -- cloudflare/staging/control-preview.mjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check cloudflare/diamonds/ff110-pilot.mjs
          node --check cloudflare/diamonds/purchases.mjs
          node --check cloudflare/diamonds/recargas-america.mjs
          node --check cloudflare/promotions/purchases.mjs
          node --check cloudflare/services/delivery.mjs
          node --check cloudflare/services/games.mjs
          node --check cloudflare/staging/worker.mjs
          node --check cloudflare/staging/auth.mjs
          node --check cloudflare/staging/panel.mjs
          node --check cloudflare/providers/ra-admin-service.mjs
          node --check cloudflare/providers/founder-balances.mjs
          node --check cloudflare/security/founder.mjs
      - name: Run mocked staging tests
        run: node --test tests/*.test.mjs cloudflare/providers/ra-admin-service.test.mjs cloudflare/staging/*.test.mjs
      - name: Compile without publishing
        shell: bash
        run: |
          npx --yes wrangler@4 deploy --config cloudflare/staging/wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/zerox-ra-build"
          test -d "$RUNNER_TEMP/zerox-ra-build"
          npx --yes wrangler@4 deploy --config cloudflare/preprod/wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/zerox-original-build"
          npx --yes wrangler@4 deploy --config cloudflare/ra-purchase/wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/zerox-ra-purchase-build"
          node --check oracle/ra-purchase/server.mjs
          echo 'STAGING_DRY_RUN_OK'
          echo 'CLOUDFLARE_UNCHANGED'

      - name: Save isolated staging bundle for local review
        uses: actions/upload-artifact@v4
        with:
          name: zerox-ra-founder-staging-dryrun
          path: ${{ runner.temp }}/zerox-ra-build/
          if-no-files-found: error
          retention-days: 3
